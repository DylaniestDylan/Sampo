[project]
name = "sampo"
version = "0.1.0"
requires-python = ">=3.14.7"
dependencies = [
    "fastapi>=0.141,<0.142",
    "jinja2>=3.1,<4",
    "uvicorn>=0.52,<0.53",
]

[dependency-groups]
test = [
    "httpx>=0.28.1,<0.29",
    "pytest>=9.1,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
